<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
    }

    .main-container {
      display: flex;
      width: 90%;
      margin-top: 40px;
      justify-content: space-between;
    }

    .form-container {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      width: 40%;
      box-shadow: 0 0 10px #00ffcc;
    }

    h2 {
      text-align: center;
      color: #00ffcc;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #00ffcc;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #00bfa5;
    }

    .error {
      color: red;
      font-size: 14px;
    }

    .history {
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
    }

    .student-name {
      cursor: pointer;
      color: #00ffcc;
      margin: 5px 0;
    }

    .student-details {
      margin-left: 15px;
      display: none;
      color: #ccc;
    }

    .image-container {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .image-container img {
      width: 90%;
      border-radius: 10px;
      box-shadow: 0 0 15px #00ffcc;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- Left side: Form -->
    <div class="form-container">
      <h2>Student Registration</h2>
      <form id="regForm">
        <input type="text" id="name" placeholder="Full Name">
        <span id="nameError" class="error"></span>

        <input type="email" id="email" placeholder="Email">
        <span id="emailError" class="error"></span>

        <input type="text" id="phone" placeholder="Phone Number">
        <span id="phoneError" class="error"></span>

        <input type="date" id="dob">
        <span id="dobError" class="error"></span>

        <select id="gender">
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
        <span id="genderError" class="error"></span>

        <input type="password" id="password" placeholder="Password">
        <span id="passError" class="error"></span>

        <input type="password" id="confirm" placeholder="Confirm Password">
        <span id="confirmError" class="error"></span>

        <textarea id="address" placeholder="Address"></textarea>
        <span id="addressError" class="error"></span>

        <button type="button" onclick="validateForm()">Submit</button>
      </form>

      <div class="history">
        <h2>Registration History</h2>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- Right side: Image -->
    <div class="image-container">
      <img src="image13.jpg" alt="Students studying with technology">
    </div>
  </div>

  <script>
    let students = [];

    function validateForm() {
      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let dob = document.getElementById("dob").value;
      let gender = document.getElementById("gender").value;
      let password = document.getElementById("password").value;
      let confirm = document.getElementById("confirm").value;
      let address = document.getElementById("address").value.trim();

      let valid = true;
      document.querySelectorAll(".error").forEach(e => e.innerText = "");

      if (name === "") { document.getElementById("nameError").innerText = "Full name is required"; valid = false; }
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      if (!email.match(emailPattern)) { document.getElementById("emailError").innerText = "Invalid email format"; valid = false; }
      const phonePattern = /^[0-9]{10}$/;
      if (!phone.match(phonePattern)) { document.getElementById("phoneError").innerText = "Enter valid 10-digit number"; valid = false; }
      if (dob === "") { document.getElementById("dobError").innerText = "Date of birth required"; valid = false; }
      if (gender === "") { document.getElementById("genderError").innerText = "Select gender"; valid = false; }
      if (password.length < 6) { document.getElementById("passError").innerText = "Password must be at least 6 characters"; valid = false; }
      if (password !== confirm) { document.getElementById("confirmError").innerText = "Passwords do not match"; valid = false; }
      if (address === "") { document.getElementById("addressError").innerText = "Address required"; valid = false; }

      if (valid) {
        alert("Your registration successful, " + name + "!");
        students.push({ name, email, phone, dob, gender, address });
        updateHistory();
        document.getElementById("regForm").reset();
      }
    }

    function updateHistory() {
      let historyDiv = document.getElementById("historyList");
      historyDiv.innerHTML = "";
      students.forEach((s, index) => {
        let nameDiv = document.createElement("div");
        nameDiv.className = "student-name";
        nameDiv.innerText = s.name;
        nameDiv.onclick = () => toggleDetails(index);

        let detailsDiv = document.createElement("div");
        detailsDiv.className = "student-details";
        detailsDiv.id = "details-" + index;
        detailsDiv.innerHTML = `
          Email: ${s.email}<br>
          Phone: ${s.phone}<br>
          DOB: ${s.dob}<br>
          Gender: ${s.gender}<br>
          Address: ${s.address}
        `;

        historyDiv.appendChild(nameDiv);
        historyDiv.appendChild(detailsDiv);
      });
    }

    function toggleDetails(index) {
      let details = document.getElementById("details-" + index);
      details.style.display = details.style.display === "none" ? "block" : "none";
    }
  </script>
</body>
</html>
